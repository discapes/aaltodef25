# docker compose -f infra/compose.yml up
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trak
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/trak
    depends_on:
      - db

volumes:
  db-data:
