services:
  server:
    image: docker.gitea.com/gitea:1.24.6-rootless
    restart: always
    user: 1000
    # https://www.redhat.com/en/blog/rootless-podman-user-namespace-modes
    userns_mode: keep-id
    volumes:
      - ./data:/var/lib/gitea
      - ./config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - GITEA__service__DISABLE_REGISTRATION=true
    ports:
      # we need to use port 80 so cloudflare does https wrapping
      - "80:3000"
      - "2222:2222"