name: Trigger Vercel Deploy Hook

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  call-deploy-hook:
    name: Call Vercel Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Invoke deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${DEPLOY_HOOK_URL}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret not set"
            exit 1
          fi
          curl -X POST "${DEPLOY_HOOK_URL}" --fail --silent --show-error
          echo "Deploy hook invoked successfully"
