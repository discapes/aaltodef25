name: Release
on:
  push:
    branches:
      - master

permissions:
  contents: read # for checkout

jobs:
  release:
    name: Release
    # "ubuntu-22.04-arm, ubuntu-24.04-arm and windows-11-arm are not supported yet for private repositories"
    # we can't use --platform=linux/arm64 since we would need qemu-user-static or something to avoid exec format error
    # runs-on: ubuntu-24.04-arm
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Run semantic-release
        id: check_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
          if git describe --tags --exact-match 2>/dev/null; then
            echo "is_tagged=true" >> $GITHUB_OUTPUT
          else
            echo "is_tagged=false" >> $GITHUB_OUTPUT
          fi
      - name: Release container image and Helm chart
        if: steps.check_tag.outputs.is_tagged == 'true'
        env:
          REGISTRY_USERNAME: ${{ secrets.GITEA_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.GITEA_PASSWORD }}
        run: |
            set -euo pipefail
            VERSION="$(git describe --tags --exact-match | tail -c +2)"
            REPO=gitea.miikat.dev/ci/trak
            IMAGE="$REPO:$VERSION"
            HELM_REPO="oci://$REPO-helm"
            export REGISTRY_AUTH_FILE="$PWD/registry-auth.json"
            podman login -u "$REGISTRY_USERNAME" -p "$REGISTRY_PASSWORD" gitea.miikat.dev
            podman build -t "$IMAGE" -f infra/Dockerfile . 
            podman push "$IMAGE"
            helm dependency update infra/helm/trak
            helm package infra/helm/trak --version "$VERSION" --app-version "$VERSION"
            helm --registry-config "$REGISTRY_AUTH_FILE" push "trak-$VERSION.tgz" "$HELM_REPO"
            